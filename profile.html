<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hồ Sơ Vận Động Viên - Strava Style</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Hệ thống & CSS riêng -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/profile.css">
    
    <!-- Thẻ đồng bộ theme động -->
    <link id="dynamic-theme-css" rel="stylesheet" href="">
</head>
<body>

    <div class="app-container">
        
        <!-- HEADER CỐ ĐỊNH PHONG CÁCH STRAVA APP -->
        <header class="app-header-strava">
            <div class="header-top-row">
                <div class="user-mini-profile">
                    <img src="avatars/default.png" alt="Avatar" id="header-avatar" onerror="this.src='avatars/default.jpg'">
                </div>
                <div class="header-title">Hồ Sơ</div>
                <div class="header-actions">
                   
                </div>
            </div>

            <!-- THANH TABS CHÍNH -->
            <div class="strava-main-tabs">
                <button class="main-tab-btn active" onclick="switchMainTab('progress', event)">Tiến trình</button>
                <button class="main-tab-btn" onclick="switchMainTab('activities', event)">Hoạt động</button>
                <button class="main-tab-btn" onclick="window.location.href='wall.html'">Thành tích</button>
            </div>
        </header>

        <!-- NỘI DUNG CHÍNH -->
        <main class="app-content-strava">

            <!-- THANH DANH SÁCH THÀNH VIÊN CUỘN NGANG -->
            <div class="members-carousel-card">
                <div class="members-carousel-wrapper">
                    <div class="avatar-scroll-list" id="members-avatar-list">
                        <!-- Danh sách avatar render động từ JS -->
                    </div>
                </div>
            </div>
            
            <!-- THÔNG TIN TỔNG QUAN HỒ SƠ -->
            <div id="profile-bio-section">
                <div class="profile-main-info">
                    <div class="avatar-large-wrapper">
                        <img src="avatars/default.png" alt="Avatar" id="user-avatar" onerror="this.src='avatars/default.jpg'">
                    </div>
                    <div class="user-details-text">
                        <h2 id="user-name">Đang tải...</h2>
                        <p class="location-text" id="user-location">Triathlon Lục Nam</p>
                    </div>
                </div>
            </div>

            <!-- ================= THẺ 1: TIẾN TRÌNH ================= -->
            <div class="tab-pane active" id="tab-progress">
                
                <!-- Bộ lọc môn thể thao -->
                <div class="sport-filter-chips">
                    <button class="chip active" onclick="filterSport('all', event)"><i class="fa-solid fa-chart-pie"></i> Tổng</button>
                    <button class="chip" onclick="filterSport('bike', event)"><i class="fa-solid fa-person-biking"></i> Đạp xe</button>
                    <button class="chip" onclick="filterSport('swim', event)"><i class="fa-solid fa-person-swimming"></i> Bơi lội</button>
                    <button class="chip" onclick="filterSport('run', event)"><i class="fa-solid fa-person-running"></i> Chạy bộ</button>
                </div>

                <!-- Card Thống kê theo thời gian -->
                <div class="strava-card">
                    <div class="card-section-header">
                        <div class="card-section-title" id="chart-title">Tháng này</div>
                        <div class="chart-time-filters">
                            <button class="time-filter-btn active" onclick="switchChartTime('month', event)">Tháng</button>
                        </div>
                    </div>

                    <div class="metrics-grid">
                        <div>
                            <span class="m-label">Quãng đường</span>
                            <strong class="m-value" id="val-distance">0 km</strong>
                        </div>
                        <div>
                            <span class="m-label">Điểm IM</span>
                            <strong class="m-value" id="val-time">0 điểm</strong>
                        </div>
                    </div>
                </div>
                
                <!-- Card Thống kê Tỷ lệ Bơi - Đạp - Chạy -->
                <div class="strava-card">
                    <div class="card-section-header">
                        <div class="card-section-title">Tỷ lệ Ba môn phối hợp</div>
                        <div class="count-badge">Tổng quan</div>
                    </div>

                    <div class="multisport-chart-wrapper">
                        <div class="pie-chart" style="background: conic-gradient(#e5e7eb 0% 100%);"></div>

                        <div class="pie-legend">
                            <div class="legend-item">
                                <span class="legend-dot swim"></span>
                                <span class="legend-label">Bơi</span>
                                <strong>0%</strong>
                            </div>
                            <div class="legend-item">
                                <span class="legend-dot bike"></span>
                                <span class="legend-label">Đạp</span>
                                <strong>0%</strong>
                            </div>
                            <div class="legend-item">
                                <span class="legend-dot run"></span>
                                <span class="legend-label">Chạy</span>
                                <strong>0%</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= THẺ 2: HOẠT ĐỘNG (HIỂN THỊ CHI TIẾT GHI CHÚ, MỨC ĐỘ, CHẤN THƯƠNG) ================= -->
            <div class="tab-pane" id="tab-activities">
                <div class="search-activity-box" style="margin-bottom: 12px;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="activity-search-input" placeholder="Tìm kiếm hoạt động...">
                </div>
                <!-- Container chứa danh sách hoạt động render từ JS -->
                <div id="activities-list-container">
                    <p style="text-align: center; color: var(--text-secondary); margin: 20px 0;">Đang cập nhật danh sách hoạt động gần đây...</p>
                </div>
            </div>

            <!-- ================= THẺ 3: THÀNH TÍCH (WALL) ================= -->
            <div class="tab-pane" id="tab-workouts">
                <div class="strava-card">
                    <p style="text-align: center; color: var(--text-secondary); margin: 20px 0;">Đang tải bảng thành tích...</p>
                </div>
            </div>

        </main>

        <div class="bottom-spacer"></div>

        <!-- THANH ĐIỀU HƯỚNG DƯỚI CÙNG -->
        <nav class="bottom-nav">
            <a href="admin.html" class="nav-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span>ADMIN</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-medal"></i>
                <span>Tường</span>
            </a>
            <a href="member.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Cá nhân</span>
            </a>
            <a href="ranking.html" class="nav-item">
                <i class="fa-solid fa-trophy"></i>
                <span>Xếp hạng</span>
            </a>  
            <a href="https://docs.google.com/spreadsheets/d/1AWZRIlJTNjbVUdLm4X-oItdpyBzfO6kq/edit?gid=996045951#gid=996045951" class="nav-item" target="_blank">
                <i class="fa-solid fa-chart-line"></i>
                <span>Báo cáo</span>
            </a>
        </nav>
    </div>

    <!-- Tệp JavaScript xử lý giao diện -->
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/swipe.js" defer></script>
</body>
</html>
